<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { ink: '#F5F5F5', ocean: '#3B82F6', mist: '#0A0A0A' },
            boxShadow: { lift: '0 18px 45px -28px rgba(15, 42, 67, .45)' }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://cdn.sheetjs.com" />
    <!-- xlsx-js-style writes the Excel fills, fonts, hyperlinks, and date formats used below. -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="min-h-screen bg-mist text-slate-700 antialiased">
    <main class="mx-auto flex h-screen w-[95vw] max-w-none flex-col overflow-hidden py-5">
      <dialog id="uploadPanel" class="w-[min(42rem,calc(100%-2rem))] rounded-2xl border border-slate-200 bg-white p-0 text-inherit shadow-2xl">
        <div class="p-6 sm:p-9">
        <div class="flex items-start gap-4">
          <div class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-blue-50 text-xl text-ocean">↥</div>
          <div class="flex-1">
            <h2 class="text-lg font-semibold text-ink">Create an audit workbook</h2>
            <p class="mt-1 text-sm leading-6 text-slate-500">Select an Excel export that contains an <strong>All Tickets</strong> sheet. Your data stays in this browser.</p>
          </div>
          <button id="closeUploadDialog" type="button" aria-label="Close" class="grid h-8 w-8 place-items-center rounded-lg text-slate-500 hover:bg-slate-50 hover:text-ink">×</button>
        </div>
        <label id="dropZone" for="fileInput" class="mt-7 flex min-h-48 cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 px-6 text-center transition hover:border-ocean hover:bg-blue-50">
          <span class="mb-3 grid h-12 w-12 place-items-center rounded-full bg-white text-2xl text-ocean shadow-sm">⌑</span>
          <span class="font-semibold text-ink">Drop an Excel workbook here</span>
          <span class="mt-1 text-sm text-slate-500">or choose a .xlsx file from your computer</span>
          <span class="mt-4 rounded-lg bg-ocean px-4 py-2 text-sm font-semibold text-white">Choose workbook</span>
          <input id="fileInput" type="file" accept=".xlsx,.xls" class="sr-only" />
        </label>
        <div id="fileDetails" class="mt-5 hidden items-center justify-between rounded-lg bg-slate-50 px-4 py-3 text-sm"></div>
        <p id="uploadError" role="alert" class="mt-4 hidden rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700"></p>
        </div>
      </dialog>

      <section id="auditPanel" class="hidden min-h-0 flex-1">
          <div class="flex shrink-0 flex-col gap-4 pb-5 lg:flex-row lg:items-center lg:justify-between">
            <div class="flex min-w-0 items-center gap-3">
              <h2 class="shrink-0 text-xl font-bold tracking-tight text-ink">Ticket Audit</h2>
              <span id="ticketTotal" class="shrink-0 rounded-full bg-blue-50 px-2.5 py-1 text-xs font-semibold text-ocean"></span>
              <p id="auditStatus" class="truncate text-sm text-slate-500"></p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <time id="currentTime" class="font-mono text-xs text-slate-500"></time>
              <button id="newAuditButton" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-ink">
                <span class="text-base leading-none">+</span> New audit
              </button>
            </div>
          </div>

        <div class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lift">
          <div class="shrink-0 border-b border-slate-200">
            <div class="flex flex-wrap items-center gap-2 px-5 py-3">
              <label for="technicianGroupFilter" class="text-sm font-medium text-slate-500">Technicians</label>
              <select id="technicianGroupFilter" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 outline-none ring-ocean focus:ring-2">
                <option value="all">All technicians</option>
                <option value="ph">PH</option>
                <option value="col">COL</option>
              </select>
              <div class="relative ml-auto flex shrink-0 items-center gap-2">
              <label for="searchInput" class="sr-only">Search tickets</label>
              <input id="searchInput" type="search" placeholder="Search this sheet" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none ring-ocean focus:ring-2 sm:w-56" />
              <button id="columnsButton" type="button" aria-label="Choose visible columns" title="Choose visible columns" class="grid h-9 w-9 place-items-center rounded-lg border border-slate-300 bg-white text-slate-500 hover:bg-slate-50 hover:text-ocean">
                <svg aria-hidden="true" viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current stroke-2"><path d="M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M11 16v4" /></svg>
              </button>
              <div id="columnMenu" class="absolute right-0 top-11 z-20 hidden w-64 rounded-xl border border-slate-200 bg-white p-2 shadow-2xl">
                <p class="px-2 py-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Visible columns</p>
                <div id="columnOptions" class="max-h-72 space-y-1 overflow-y-auto"></div>
              </div>
            </div>
            </div>
            <div class="flex min-w-0 border-t border-slate-200 px-5 pt-1">
              <div id="sheetTabs" class="-mb-px flex min-w-0 flex-1 gap-1 overflow-x-auto" role="tablist"></div>
            </div>
          </div>

          <div class="m-5 mt-4 flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white">
            <div class="table-wrap min-h-0 flex-1">
              <table class="min-w-full border-separate border-spacing-0 text-left text-sm">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
              </table>
              <p id="emptyState" class="hidden py-14 text-center text-sm text-slate-500">No tickets match your search.</p>
            </div>
            <div class="flex items-center justify-between border-t border-slate-200 bg-slate-50/70 px-5 py-3">
              <button id="clearDoneButton" class="hidden text-sm font-medium text-slate-600 hover:text-ink">Clear Done marks</button>
              <button id="downloadButton" class="ml-auto rounded-lg bg-ocean px-3.5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#173d60]">Download Ticket_Audit.xlsx</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
